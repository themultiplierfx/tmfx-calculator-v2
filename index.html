<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMFX SAFE TRADE CALCULATOR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#081027;color:#fff;padding:15px}
h1{text-align:center;color:#ffcc33;font-size:18px;margin:10px 0 15px;letter-spacing:1px}
.box{background:#12203f;border:1px solid #1e335f;border-radius:12px;padding:15px;margin-bottom:15px}
.box-title{color:#ffcc33;font-size:13px;font-weight:bold;margin-bottom:10px}
label{font-size:11px;color:#8aa0c8}
select,input{width:100%;padding:12px;background:#0b1733;border:1px solid #2a4270;border-radius:8px;color:#fff;margin-top:5px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.data-box{background:#0b1733;border:1px solid #2a4270;border-radius:8px;padding:10px;text-align:center;margin-top:5px}
.data-box span{display:block;font-size:10px;color:#8aa0c8}
.data-box b{font-size:13px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-blue{background:#1e90ff;color:#fff}
.btn-red{background:#ff3344;color:#fff;margin-top:8px}
.api-error{background:#0a3a1a;border:1px solid #00ff66;color:#00ff66;padding:10px;border-radius:8px;font-size:11px;text-align:center;margin-top:10px;display:none}
#pairList{position:absolute;z-index:100;width:100%;background:#0b1733;border:1px solid #ffcc33;border-radius:8px;max-height:220px;overflow-y:auto;display:none}
#pairList div{padding:10px;border-bottom:1px solid #1a2c52;cursor:pointer}
#pairList div:hover{background:#1e335f}
.current-price{border:1px solid #00ff66 !important}
</style>
</head>
<body>
<h1>TMFX SAFE TRADE CALCULATOR</h1>

<div class="box">
<div class="box-title">BOX 1: SELECT PAIR</div>
<div class="grid2">
<div style="position:relative;">
<label>SELECT PAIR - SEARCH</label>
<input type="text" id="pairSearch" placeholder="Type e.g USDCAD, GOLD" autocomplete="off" onfocus="showPairList()" onkeyup="filterPairs()">
<div id="pairList"></div>
</div>
<div>
<label>MODE</label>
<select id="modeSelect"><option>AUTO</option><option>MANUAL</option></select>
</div>
</div>
<div id="apiError" class="api-error"></div>
</div>
<div class="box">
<div class="box-title">BOX 2: MARKET DATA (HLC + CURRENT)</div>
<div class="grid3">
<div><label>DAILY HIGH</label><div class="data-box"><b id="dHigh">-</b></div></div>
<div><label>DAILY LOW</label><div class="data-box"><b id="dLow">-</b></div></div>
<div><label>DAILY CLOSE</label><div class="data-box"><b id="dClose">-</b></div></div>
</div>
<div class="grid3">
<div><label>WEEKLY HIGH</label><div class="data-box"><b id="wHigh">-</b></div></div>
<div><label>WEEKLY LOW</label><div class="data-box"><b id="wLow">-</b></div></div>
<div><label>WEEKLY CLOSE</label><div class="data-box"><b id="wClose">-</b></div></div>
</div>
<div style="margin-top:10px;">
<label>CURRENT PRICE</label>
<div class="data-box current-price"><b id="cPrice">Loading...</b></div>
</div>
<button class="btn btn-blue" onclick="calculateHLC()">CALCULATE HLC → SHOW R/S TABLE</button>
<div id="rsTable" style="margin-top:15px;display:none"></div>
</div>

<div class="box">
<div class="box-title">BOX 3: SAFE LOT SIZE CALCULATOR</div>
<div class="grid2">
<div><label>BALANCE ($)</label><input type="number" id="balance" placeholder="1000"></div>
<div><label>RISK ($/¢)</label><input type="number" id="risk" placeholder="0.05" value="0.05"></div>
</div>
<div style="margin-top:10px;"><label>SAFE LOT SIZE</label><div class="data-box" style="background:#001a33;border-color:#1e90ff;"><b id="safeLot" style="color:#1e90ff;font-size:20px;">-</b></div></div>
<button class="btn btn-blue" onclick="calculateLot()">CALCULATE SAFE LOT</button>
<button class="btn btn-red" onclick="resetAll()">🔄 RESET ALL DATA</button>
</div>

<script>
const allPairs = ["EURUSD","GBPUSD","USDJPY","USDCAD","USDCHF","AUDUSD","NZDUSD","EURGBP","EURJPY","GBPJPY","GBPAUD","EURCAD","EURAUD","GBPCHF","AUDJPY","CADJPY","GOLD","SILVER","BTCUSD","ETHUSD"];
const apiKey = "b2bbf2e69a6a4e4d8905d5c8e3a7e2a1"; // your TwelveData key

// init list
const pairListEl = document.getElementById("pairList");
function renderList(filter=""){
  pairListEl.innerHTML="";
  allPairs.filter(p=>p.includes(filter.toUpperCase())).forEach(p=>{
    let d=document.createElement("div");
    d.textContent=p;
    d.onclick=()=>selectPair(p);
    pairListEl.appendChild(d);
  });
}
function showPairList(){ renderList(document.getElementById("pairSearch").value); pairListEl.style.display="block"; }
function filterPairs(){ renderList(document.getElementById("pairSearch").value); pairListEl.style.display="block"; }
function selectPair(pair){
  document.getElementById("pairSearch").value=pair;
  pairListEl.style.display="none";
  localStorage.setItem("tmfx_pair", pair);
  fetchData(pair);
}
document.addEventListener("click", e=>{ if(!e.target.closest("#pairSearch") &&!e.target.closest("#pairList")) pairListEl.style.display="none"; });

// retain values
document.getElementById("balance").value = localStorage.getItem("tmfx_balance")||"";
document.getElementById("risk").value = localStorage.getItem("tmfx_risk")||"0.05";
document.getElementById("pairSearch").value = localStorage.getItem("tmfx_pair")||"EURUSD";
document.getElementById("balance").addEventListener("input", e=>localStorage.setItem("tmfx_balance", e.target.value));
document.getElementById("risk").addEventListener("input", e=>localStorage.setItem("tmfx_risk", e.target.value));

// fetch logic
async function fetchData(pair){
  let symbol = pair;
  if(pair==="GOLD") symbol="XAU/USD";
  if(pair==="SILVER") symbol="XAG/USD";
  if(pair==="BTCUSD") symbol="BTC/USD";
  if(pair==="ETHUSD") symbol="ETH/USD";
  if(!symbol.includes("/")) symbol = symbol.slice(0,3)+"/"+symbol.slice(3);

  document.getElementById("cPrice").textContent="Connecting...";
  document.getElementById("apiError").style.display="none";

  try{
    // daily
    let d = await fetch(`https://api.twelvedata.com/time_series?symbol=${symbol}&interval=1day&outputsize=2&apikey=${apiKey}`).then(r=>r.json());
    if(d.code===400 || d.status==="error"){ throw new Error(d.message); }
    document.getElementById("dHigh").textContent=parseFloat(d.values[0].high).toFixed(5);
    document.getElementById("dLow").textContent=parseFloat(d.values[0].low).toFixed(5);
    document.getElementById("dClose").textContent=parseFloat(d.values[0].close).toFixed(5);

    // weekly
    let w = await fetch(`https://api.twelvedata.com/time_series?symbol=${symbol}&interval=1week&outputsize=2&apikey=${apiKey}`).then(r=>r.json());
    document.getElementById("wHigh").textContent=parseFloat(w.values[0].high).toFixed(5);
    document.getElementById("wLow").textContent=parseFloat(w.values[0].low).toFixed(5);
    document.getElementById("wClose").textContent=parseFloat(w.values[0].close).toFixed(5);

    // price
    let p = await fetch(`https://api.twelvedata.com/price?symbol=${symbol}&apikey=${apiKey}`).then(r=>r.json());
    document.getElementById("cPrice").textContent=parseFloat(p.price).toFixed(5);
    document.getElementById("apiError").style.display="block";
    document.getElementById("apiError").textContent="✅ LIVE: "+symbol+" Connected";
  }catch(err){
    document.getElementById("apiError").style.display="block";
    document.getElementById("apiError").style.background="#3a0a0a";
    document.getElementById("apiError").style.color="#ff6666";
    document.getElementById("apiError").style.borderColor="#ff3344";
    document.getElementById("apiError").innerHTML="⚠️ API Limit: "+err.message+"<br>Switch to MANUAL or try BTCUSD/EURUSD which is free. SILVER needs PRO plan - use XAGUSD on TradingView for manual.";
    document.getElementById("cPrice").textContent="Enter Manual";
  }
}

function calculateHLC(){ alert("Your HLC Logic here - R/S Table will show"); }
function calculateLot(){
  let bal=parseFloat(document.getElementById("balance").value)||0;
  let risk=parseFloat(document.getElementById("risk").value)||0.05;
  if(bal<=0){ alert("Enter Balance"); return; }
  let lot=(bal*0.01/risk/100000).toFixed(2); // example logic
  document.getElementById("safeLot").textContent=lot+" LOT";
}

function resetAll(){
  if(confirm("Reset all?")){
    localStorage.clear();
    document.getElementById("balance").value="";
    document.getElementById("risk").value="0.05";
    document.getElementById("pairSearch").value="";
    document.getElementById("dHigh").textContent="-";
    document.getElementById("dLow").textContent="-";
    document.getElementById("dClose").textContent="-";
    document.getElementById("wHigh").textContent="-";
    document.getElementById("wLow").textContent="-";
    document.getElementById("wClose").textContent="-";
    document.getElementById("cPrice").textContent="-";
    document.getElementById("safeLot").textContent="-";
    document.getElementById("apiError").style.display="none";
  }
}

// auto load last pair
window.onload=()=>{ let last=localStorage.getItem("tmfx_pair"); if(last) fetchData(last); }

</script>
</body>
</html>
